name: CI - Mossambi Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MOSSAMBI_HEADLESS: "1"

jobs:
  lint-and-format:
    name: Quick Linter & Formatting Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config \
            ffmpeg

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test on ${{ matrix.os }} (${{ matrix.target }})
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config \
            ffmpeg

      - name: Install macOS Build Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg || true

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run All Workspace Tests
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build Optimized Release Binaries
        run: cargo build --release --workspace --target ${{ matrix.target }}
