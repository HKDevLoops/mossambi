name: CI - Mossambi Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MOSSAMBI_HEADLESS: "1"

jobs:
  lint-and-format:
    name: Quick Linter & Formatting Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config \
            ffmpeg

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting (cargo fmt --check)
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Pure ASCII Gate (all authored source)
        run: cargo test --test gui_ascii_gate

  test:
    name: Test on ${{ matrix.os }} (${{ matrix.target }})
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config \
            ffmpeg

      - name: Install macOS Build Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg || true

      - name: Install Windows Build Dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command scoop -ErrorAction SilentlyContinue) {
            scoop install ffmpeg
          } elseif (Get-Command choco -ErrorAction SilentlyContinue) {
            choco install ffmpeg -y --no-progress --limit-output
          }

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Check (all targets)
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

      - name: Run All Workspace Tests
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Major-Bug Regression Suite
        run: cargo test --test test_bug_regressions --target ${{ matrix.target }}

      - name: End-to-End Tier Suites
        run: |
          cargo test --test e2e_tier1_features --target ${{ matrix.target }}
          cargo test --test e2e_tier2_boundaries --target ${{ matrix.target }}
          cargo test --test e2e_tier3_combinations --target ${{ matrix.target }}
          cargo test --test e2e_tier4_scenarios --target ${{ matrix.target }}

      - name: Build Optimized Release Binaries
        run: cargo build --release --workspace --target ${{ matrix.target }}

  ci-complete:
    name: CI Aggregate Gate
    needs: [ lint-and-format, test ]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        run: echo "CI green for ${{ github.sha }}"
