name: CD - Mossambi Automated Release & Packaging

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version Tag (e.g. v2.1.0)"
        required: true
        default: "v2.1.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary_ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            binary_ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            binary_ext: ""

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Native Release Binaries
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Prepare Release Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver -or $ver -eq "") { $ver = "${{ inputs.version }}" }
          $pkgName = "mossambi-$ver-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$pkgName" -Force | Out-Null
          
          Copy-Item "target/${{ matrix.target }}/release/mossambi.exe" "dist/$pkgName/"
          Copy-Item "README.md" "dist/$pkgName/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE*" "dist/$pkgName/" -ErrorAction SilentlyContinue

          Compress-Archive -Path "dist/$pkgName/*" -DestinationPath "dist/$pkgName.zip" -Force
          Get-FileHash -Path "dist/$pkgName.zip" -Algorithm SHA256 | Out-File -FilePath "dist/$pkgName.zip.sha256"

      - name: Prepare Release Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          VER="${{ github.ref_name }}"
          if [ -z "$VER" ]; then VER="${{ inputs.version }}"; fi
          PKG_NAME="mossambi-$VER-${{ matrix.target }}"
          mkdir -p "dist/$PKG_NAME"
          
          cp "target/${{ matrix.target }}/release/mossambi" "dist/$PKG_NAME/"
          cp README.md "dist/$PKG_NAME/" 2>/dev/null || true
          cp LICENSE* "dist/$PKG_NAME/" 2>/dev/null || true

          tar -czvf "dist/$PKG_NAME.tar.gz" -C dist "$PKG_NAME"
          cd dist && sha256sum "$PKG_NAME.tar.gz" > "$PKG_NAME.tar.gz.sha256"

      - name: Prepare Release Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          VER="${{ github.ref_name }}"
          if [ -z "$VER" ]; then VER="${{ inputs.version }}"; fi
          PKG_NAME="mossambi-$VER-${{ matrix.target }}"
          mkdir -p "dist/$PKG_NAME"
          
          cp "target/${{ matrix.target }}/release/mossambi" "dist/$PKG_NAME/"
          cp README.md "dist/$PKG_NAME/" 2>/dev/null || true
          cp LICENSE* "dist/$PKG_NAME/" 2>/dev/null || true

          tar -czvf "dist/$PKG_NAME.tar.gz" -C dist "$PKG_NAME"
          cd dist && shasum -a 256 "$PKG_NAME.tar.gz" > "$PKG_NAME.tar.gz.sha256"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.*

  create-github-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifact Directory
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec cp {} release-dist/ \;
          ls -la release-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          name: Mossambi Release ${{ github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
