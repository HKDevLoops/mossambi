[workspace]
resolver = "2"
members = [
    "crates/mossambi-core",
    "crates/mossambi-codec",
    "crates/mossambi-archive",
    "crates/mossambi-exam",
    "crates/mossambi-hwaccel",
    "crates/mossambi-cli",
    "crates/mossambi-tui",
    "crates/mossambi-gui",
    "crates/mossambi-widget",
]

[workspace.package]
version = "2.1.0"
authors = ["Mossambi Systems Team"]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
dunce = "1.0"
path-absolutize = "3.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "ico", "gif"] }
resvg = "0.44"
lopdf = "0.34"
calamine = "0.28"
rust_xlsxwriter = "0.80"
csv = "1.3"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
tar = "0.4"
flate2 = "1.0"
bzip2 = "0.4"
xz2 = "0.1"
zstd = "0.13"
crc32fast = "1.4"
sha2 = "0.10"
regex = "1.11"
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
ratatui = "0.29"
crossterm = "0.28"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Foundation", "Win32_Graphics_Gdi"] }

# Internal Workspace Crates
mossambi-core = { path = "crates/mossambi-core" }
mossambi-codec = { path = "crates/mossambi-codec" }
mossambi-archive = { path = "crates/mossambi-archive" }
mossambi-exam = { path = "crates/mossambi-exam" }
mossambi-hwaccel = { path = "crates/mossambi-hwaccel" }
mossambi-tui = { path = "crates/mossambi-tui" }
mossambi-gui = { path = "crates/mossambi-gui" }
