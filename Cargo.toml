[package]
name = "mossambi"
version = "2.1.0"
authors = ["Mossambi Systems Team"]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "Zero-loss native desktop file converter, archive suite, Indian exam form tuner, and macOS-style Universal File Explorer"

[lib]
name = "mossambi"
path = "src/lib.rs"

[[bin]]
name = "mossambi"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
dunce = "1.0"
path-absolutize = "3.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "ico", "gif"] }
resvg = "0.44"
lopdf = "0.34"
calamine = "0.28"
rust_xlsxwriter = "0.80"
csv = "1.3"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
tar = "0.4"
flate2 = "1.0"
bzip2 = "0.4"
xz2 = "0.1"
zstd = "0.13"
crc32fast = "1.4"
sha2 = "0.10"
regex = "1.11"
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
winit = { version = "0.30", default-features = false }
rfd = "0.15"
walkdir = "2.5"
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
rhai = { version = "1.27", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# Real OLE drag-out source: generated COM via windows-core's `#[implement]`
# (see core/ole_drag_out.rs). Version-locked to windows-core 0.59 so the
# proc-macro and the generated interfaces stay ABI-compatible.
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }
# The `#[implement]` proc-macro expands to code that addresses
# `windows_core` by crate name, so it must be a direct dependency.
windows-core = "0.59"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = "3.16"
