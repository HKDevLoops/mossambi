ShortDescription: Zero-loss native desktop file converter, archive suite, and Indian exam form tuner.
Description: |
  Mossambi is a high-performance native desktop file conversion suite and Indian competitive exam form optimizer.
  Features:
  - 1 shared pure-Rust conversion engine with 3 user interfaces: CLI, TUI, and GUI/Floating Radial Widget.
  - 0.00% Zero-Loss mathematical remuxing for video, audio, and images.
  - Native Windows System Tray integration with global activation (WIN+CTRL or circular drag gesture).
  - Indian Competitive Exam & Job Application Form Studio (UPSC, SSC, IBPS, GATE, RRB) with 100% scorecard convergence.
  - Streaming file quality inspector & high-resolution benchmark engine.
  - Shell auto-completions and context-aware Carapace bridge.
