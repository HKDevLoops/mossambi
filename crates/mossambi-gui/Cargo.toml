[package]
name = "mossambi-gui"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native macOS-Styled Desktop Radial Widget and GUI for Mossambi"

[dependencies]
mossambi-core = { workspace = true }
mossambi-codec = { workspace = true }
mossambi-archive = { workspace = true }
mossambi-exam = { workspace = true }
mossambi-hwaccel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
eframe = { workspace = true }
image = { workspace = true }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Com", "Win32_System_Ole"] }
