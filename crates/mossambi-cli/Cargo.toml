[package]
name = "mossambi-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fast UNIX-style CLI for Mossambi zero-loss file converter"

[[bin]]
name = "mossambi"
path = "src/main.rs"

[dependencies]
mossambi-core = { workspace = true }
mossambi-codec = { workspace = true }
mossambi-archive = { workspace = true }
mossambi-exam = { workspace = true }
mossambi-hwaccel = { workspace = true }
mossambi-tui = { workspace = true }
mossambi-gui = { workspace = true }
mossambi-widget = { workspace = true }
eframe = { workspace = true }
crossterm = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
dunce = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
image = { workspace = true }
