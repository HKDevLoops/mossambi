[package]
name = "mossambi-widget"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure topbarless, frameless, transparent radial fruit widget for Mossambi"

[dependencies]
mossambi-core = { workspace = true }
mossambi-codec = { workspace = true }
mossambi-archive = { workspace = true }
mossambi-exam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
eframe = { workspace = true }
image = { workspace = true }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi"] }
